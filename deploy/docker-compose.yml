# QuizForge V2 single-server stack (architecture overview, section 7).
#
#   docker compose -f deploy/docker-compose.yml up --build
#   curl http://localhost:8088/api/health
#
# Services: nginx (only public entry) -> app -> mysql / isolated rule-runner.

name: quizforge

services:
  blobs-init:
    build: ../rule-runner
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 10001:0 /data/blobs && chmod 0755 /data/blobs"]
    volumes:
      - blobs:/data/blobs
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quizforge
      MYSQL_USER: quizforge
      MYSQL_PASSWORD: ${QF_DB_PASSWORD:-quizforge}
      MYSQL_ROOT_PASSWORD: ${QF_DB_ROOT_PASSWORD:-quizforge-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uquizforge -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      QF_DB_URL: jdbc:mysql://mysql:3306/quizforge?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
      QF_DB_USER: quizforge
      QF_DB_PASSWORD: ${QF_DB_PASSWORD:-quizforge}
      QF_RULE_RUNNER_TOKEN: ${QF_RULE_RUNNER_TOKEN:-quizforge-local-rule-token}
      QF_BLOB_DIR: /data/blobs
      QF_PUBLIC_ORIGIN: ${QF_PUBLIC_ORIGIN:-http://localhost:8088}
      # 邮件 / 短信验证码与人机验证（L4）。本机开发与 CI 默认使用假实现（验证码写入应用日志，
      # 只允许本机或 .test 来源）；正式部署设 QF_VERIFICATION_MODE=provider，密钥只放在 git 忽略的
      # deploy/.env 中，provider 模式下两个摘要密钥缺失时启动失败。
      QF_VERIFICATION_MODE: ${QF_VERIFICATION_MODE:-fake}
      QF_EMAIL_CODE_PEPPER: ${QF_EMAIL_CODE_PEPPER:-}
      QF_SMS_CODE_PEPPER: ${QF_SMS_CODE_PEPPER:-}
      QF_SMS_DAILY_LIMIT: ${QF_SMS_DAILY_LIMIT:-100}
      QF_EMAIL_DAILY_LIMIT: ${QF_EMAIL_DAILY_LIMIT:-100}
      # 按 IP 的上限（旧平台规则）；只在自动化浏览器测试中调高。
      QF_AUTH_RATE_LIMIT_PER_MINUTE: ${QF_AUTH_RATE_LIMIT_PER_MINUTE:-12}
      QF_VERIFICATION_IP_LIMIT_10MIN: ${QF_VERIFICATION_IP_LIMIT_10MIN:-5}
      QF_VERIFICATION_IP_LIMIT_DAILY: ${QF_VERIFICATION_IP_LIMIT_DAILY:-20}
      QF_TENCENT_SES_ENABLED: ${QF_TENCENT_SES_ENABLED:-false}
      QF_TENCENT_SECRET_ID: ${QF_TENCENT_SECRET_ID:-}
      QF_TENCENT_SECRET_KEY: ${QF_TENCENT_SECRET_KEY:-}
      QF_TENCENT_SES_FROM: ${QF_TENCENT_SES_FROM:-}
      QF_TENCENT_SES_TEMPLATE_ID: ${QF_TENCENT_SES_TEMPLATE_ID:-}
      QF_TENCENT_SES_REGION: ${QF_TENCENT_SES_REGION:-ap-hongkong}
      QF_ALIYUN_SMS_ENABLED: ${QF_ALIYUN_SMS_ENABLED:-false}
      QF_ALIYUN_SMS_ACCESS_KEY_ID: ${QF_ALIYUN_SMS_ACCESS_KEY_ID:-}
      QF_ALIYUN_SMS_ACCESS_KEY_SECRET: ${QF_ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      QF_ALIYUN_SMS_SIGN_NAME: ${QF_ALIYUN_SMS_SIGN_NAME:-}
      QF_ALIYUN_SMS_TEMPLATE_CODE: ${QF_ALIYUN_SMS_TEMPLATE_CODE:-}
      QF_TURNSTILE_SITE_KEY: ${QF_TURNSTILE_SITE_KEY:-}
      QF_TURNSTILE_SECRET_KEY: ${QF_TURNSTILE_SECRET_KEY:-}
    volumes:
      - blobs:/data/blobs
    depends_on:
      blobs-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks: [internal, rules-private]

  rule-runner:
    build: ../rule-runner
    depends_on:
      blobs-init:
        condition: service_completed_successfully
    environment:
      QF_RULE_RUNNER_TOKEN: ${QF_RULE_RUNNER_TOKEN:-quizforge-local-rule-token}
      QF_BLOB_DIR: /data/blobs
      QF_RULE_WORKER_LIMIT: "4"
    volumes:
      - blobs:/data/blobs:ro
    networks: [rules-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 64
    ulimits:
      core: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/v1/health',{headers:{'X-Internal-Token':process.env.QF_RULE_RUNNER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    build: ../frontend
    ports:
      - "${QF_HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - blobs:/data/blobs:ro
      # 客户端安装包与 manifest.json（作者放在宿主机目录，见 tools/downloads/README.md）。
      - ${QF_DOWNLOADS_DIR:-./downloads}:/data/downloads:ro
    depends_on:
      - app
    networks: [internal, public]

networks:
  # Only app and rule-runner join this network; runner has no external route.
  rules-private:
    internal: true
  internal:
  public:

volumes:
  mysql-data:
  blobs:
