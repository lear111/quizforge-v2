# 生产最小监控。只抓取本机容器，不配置远程写入。
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: quizforge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:9091]
  - job_name: rule-runner
    metrics_path: /v1/metrics/prometheus
    follow_redirects: false
    http_headers:
      X-Internal-Token:
        files: [/etc/prometheus/runner-token]
    static_configs:
      - targets: [rule-runner:8090]
  - job_name: mysql
    static_configs:
      - targets: [mysql-exporter:9104]
