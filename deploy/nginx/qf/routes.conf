# 所有环境共用的路由（开发、CI 与生产）。入口文件：default.conf（HTTP）、prod.conf.template（HTTPS）。
# 注意：location 内只要有 add_header，就不再继承上层的 add_header，必须再 include 安全响应头。

include /etc/nginx/qf/security-headers.conf;
# 应用（Spring Security）也会发送这些头；统一由 Nginx 发送，避免重复或互相矛盾。
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Strict-Transport-Security;

client_max_body_size 64m;          # Default ceiling; import has its own limit below.

# Management is available only on the app's separate internal listener.
location = /actuator { return 404; }
location ^~ /actuator/ { return 404; }
location = /v1/metrics/prometheus { return 404; }

# Dynamic API -> Spring Boot
# 原文件直接流式转发；不能沿用普通 API 的 64 MiB 上限与请求缓冲。
location = /api/library/uploads {
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    error_page 413 = @import_too_large;
}

# 发布到题库广场（上传题库包、上传新版本）：题库包与截图。
location ~ ^/api/catalog/packs(/[^/]+/revisions)?$ {
    client_max_body_size 150m;
    proxy_request_buffering off;
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    error_page 413 = @import_too_large;
}

location @import_too_large {
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    add_header Cache-Control no-store always;
    return 413 '{"error":{"code":"LIBRARY_ARCHIVE_LIMIT","message":"题库包超过上传上限"}}';
    include /etc/nginx/qf/security-headers.conf;
}

# 客户端 AI 网关（遗留契约 C-05 第 9 节）：请求上限 13 MiB；一次最多试 3 个 Key，读超时要长于普通 API。
location = /api/ai/v1/chat/completions {
    client_max_body_size 14m;
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    error_page 413 = @ai_too_large;
}

location @ai_too_large {
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    add_header Cache-Control no-store always;
    return 413 '{"error":{"code":"AI_REQUEST_TOO_LARGE","message":"请求超过 12 MiB 上限"}}';
    include /etc/nginx/qf/security-headers.conf;
}

# 设备授权确认页（浏览器）由应用检查登录状态后生成。
location = /connect/authorize {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# 已发布客户端的“题库广场”入口写死为 /manage/#library；V2 的题库广场在 /plaza/。
location ^~ /manage { absolute_redirect off; return 302 /plaza/; }

location /api/ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆盖而不是追加：应用只信任 Nginx 看到的对端地址（认证接口按 IP 限频）。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Mutable fork paths must revalidate; versioned shared components are immutable.
# Spring authorizes every request before handing immutable bytes to Nginx.
location ^~ /_qf_sdk/ {
    internal;
    alias /usr/share/nginx/sdk/;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "private, no-store" always;
    include /etc/nginx/qf/security-headers.conf;
}
location ^~ /_qf_blobs/ {
    internal;
    alias /data/blobs/sha256/;
    add_header Cache-Control "private, no-store" always;
    include /etc/nginx/qf/security-headers.conf;
}
# Richtext bundles are served only through the authenticated SDK route.
location ^~ /shared/richtext/ { return 404; }
location = /practice { return 308 /practice/; }
location /practice/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/qf/security-headers.conf;
}
location = /shared/richtext/service.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/qf/security-headers.conf;
}
location /shared/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/qf/security-headers.conf;
}

# 客户端下载页（功能盘点 G 节）：安装包与清单由作者放在宿主机目录（挂载为 /data/downloads，只读），
# 由 Nginx 直接提供，Java 不读取文件内容。发布步骤见 tools/downloads/README.md。
location = /download { absolute_redirect off; return 308 /download/; }
location = /download/manifest.json {
    alias /data/downloads/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/qf/security-headers.conf;
}
# 只提供清单可能引用的文件名（字母或数字开头，不含路径分隔符），其余一律 404。
location ~ "^/download/files/([A-Za-z0-9][A-Za-z0-9._-]{0,120})$" {
    alias /data/downloads/$1;
    types {
        application/vnd.microsoft.portable-executable exe;
        application/vnd.android.package-archive apk;
    }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "no-cache" always;
}
location /download/files/ { return 404; }

# 未知静态路径明确返回带样式的 404；API 错误仍由应用处理。
error_page 404 /404.html;
location = /404.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/qf/security-headers.conf;
}

location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/qf/security-headers.conf;
}
