# 安全响应头的取值（http 级别）。各页面需要的来源与策略的理由见 docs/ops/01-deploy.md 第 4 节。

# 普通页面：脚本只来自本站与 Turnstile。
# 练习空间：拓展以 srcdoc 注入 sandbox iframe，srcdoc 文档继承宿主页面的 CSP，并与 iframe 自己的 CSP 同时生效，
# 所以这里必须放行 iframe 的内联脚本（'unsafe-inline'）与 blob: Worker（浏览器判分）。真正的限制在 iframe 自己的策略
# （bridge/frame.js、grading/browser-rules.js：nonce、connect-src 'none'），这里不改变它们。
# 练习空间的 connect-src、media-src 允许 https:：听力材料可以是任意 HTTPS 网络音频（设计 06）。
map $uri $qf_csp {
    default                "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/practice(/|$)       "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' https: blob:; connect-src 'self' https: blob: data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # 确认页由应用生成，带自己更严格的 CSP（ConnectController）；两个 CSP 会同时生效，这里不再添加。
    /connect/authorize     "";
    # JSON 接口与用户上传的文件都不应该作为页面执行。
    ~^/(api|_qf_blobs|_qf_sdk)/ "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

# 只有 HTTPS 才发送 HSTS（不含 includeSubDomains：同一域名下可能还有其他服务）。
map $scheme $qf_hsts {
    default "";
    https   "max-age=31536000";
}
