# Nginx: the only public entry (ADR-007, architecture overview 4.1).
# HTTPS termination is added in the deployment milestone; this config is for local and CI.

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;          # Default ceiling; import has its own limit below.

    # Management is available only on the app's separate internal listener.
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }
    location = /v1/metrics/prometheus { return 404; }

    # Dynamic API -> Spring Boot
    location = /api/library/import {
        client_max_body_size 129m;    # 128 MiB file plus bounded multipart framing.
        proxy_request_buffering off;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：应用只信任 Nginx 看到的对端地址（认证接口按 IP 限频）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        error_page 413 = @import_too_large;
    }

    location @import_too_large {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"LIBRARY_ARCHIVE_LIMIT","message":"题库包超过上传上限"}}';
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：应用只信任 Nginx 看到的对端地址（认证接口按 IP 限频）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Mutable fork paths must revalidate; versioned shared components are immutable.
    # Spring authorizes every request before handing immutable bytes to Nginx.
    location ^~ /_qf_sdk/ {
        internal;
        alias /usr/share/nginx/sdk/;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /_qf_blobs/ {
        internal;
        alias /data/blobs/sha256/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Richtext bundles are served only through the authenticated SDK route.
    location ^~ /shared/richtext/ { return 404; }
    location = /practice { return 308 /practice/; }
    location /practice/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /shared/richtext/service.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }
    location /shared/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Temporary account page.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
