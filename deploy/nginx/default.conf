# Nginx: the only public entry (ADR-007, architecture overview 4.1).
# HTTPS termination is added in the deployment milestone; this config is for local and CI.

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;          # Default ceiling; import has its own limit below.

    # Dynamic API -> Spring Boot
    location = /api/library/import {
        client_max_body_size 129m;    # 128 MiB file plus bounded multipart framing.
        proxy_request_buffering off;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        error_page 413 = @import_too_large;
    }

    location @import_too_large {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"LIBRARY_ARCHIVE_LIMIT","message":"题库包超过上传上限"}}';
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static frontend (ADR-006: reused legacy frontend lands here in M4)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
