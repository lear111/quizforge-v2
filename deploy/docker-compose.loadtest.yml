# Always use a disposable qf-loadtest* project. No metrics port is published on app.
services:
  app:
    build:
      target: profiling
    cpus: 1.5
    mem_limit: 3g
    environment:
      QF_MANAGEMENT_ADDRESS: 0.0.0.0
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g -XX:ActiveProcessorCount=2 -XX:FlightRecorderOptions=stackdepth=128
    networks: [monitoring]
  mysql:
    cpus: 1.0
    mem_limit: 3g
    labels:
      qf.loadtest: "true"
  rule-runner:
    environment:
      QF_RULE_WORKER_LIMIT: "8"
    cpus: 1.25
    mem_limit: 1536m
    networks: [monitoring]
  nginx:
    cpus: 0.25
    mem_limit: 512m
    # Override rather than append the base port; bind the load target to loopback.
    ports: !override
      - "127.0.0.1:${QF_HTTP_PORT:-8088}:80"
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports: ["127.0.0.1:${QF_PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ../loadtest/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    configs:
      - source: runner-metrics-token
        target: /etc/prometheus/runner-token
    networks: [monitoring, public]
    cpus: 0.5
    mem_limit: 512m
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:${QF_GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${QF_GRAFANA_PASSWORD:-loadtest-local-only}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    volumes:
      - ../loadtest/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../loadtest/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring, public]
    cpus: 0.5
    mem_limit: 512m
  k6:
    image: grafana/k6:1.2.3
    profiles: [tools]
    working_dir: /work
    volumes: ["../loadtest:/work:ro"]
    environment:
      K6_NO_USAGE_REPORT: "true"
      BASE_URL: http://nginx
      ORIGIN: ${QF_PUBLIC_ORIGIN:-http://localhost:8088}
    networks: [internal]
    cpus: 1.0
    mem_limit: 512m
  container-metrics:
    build: ../loadtest/profiling/exporter
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
  jfr-converter:
    profiles: [tools]
    build: ../loadtest/profiling/converter
    network_mode: none
    working_dir: /data
    volumes: ["../loadtest/artifacts:/data"]
    cpus: 1.0
    mem_limit: 1g
networks:
  monitoring:
    internal: true
volumes:
  prometheus-data:
  grafana-data:
configs:
  runner-metrics-token:
    content: ${QF_RULE_RUNNER_TOKEN:-quizforge-local-rule-token}
