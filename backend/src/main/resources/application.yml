spring:
  application:
    name: quizforge-backend
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 129MB
      file-size-threshold: 0
      resolve-lazily: true
  datasource:
    url: ${QF_DB_URL:jdbc:mysql://localhost:3306/quizforge?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${QF_DB_USER:quizforge}
    password: ${QF_DB_PASSWORD:quizforge}
    hikari:
      # Initial value; tune after load testing (ADR-002).
      maximum-pool-size: ${QF_DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  type-handlers-package: cloud.treenewbee.quizforge.shared.persistence
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

server:
  port: ${QF_PORT:8080}
  # The app sits behind Nginx; trust X-Forwarded-* only from it (deploy/nginx).
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO

qf:
  import:
    max-concurrency: ${QF_IMPORT_CONCURRENCY:2}
    requests-per-minute: ${QF_IMPORT_REQUESTS_PER_MINUTE:5}
  storage:
    blob-dir: ${QF_BLOB_DIR:./data/blobs}
  security:
    allowed-origin: ${QF_PUBLIC_ORIGIN:http://localhost:8088}
  # 邮件、短信验证码与人机验证（L4）。密钥只通过环境变量提供，不进入仓库。
  # mode=fake 只用于本机开发与测试（验证码写入日志），且只允许本机或 .test 来源。
  verification:
    mode: ${QF_VERIFICATION_MODE:provider}
    email-pepper: ${QF_EMAIL_CODE_PEPPER:}
    sms-pepper: ${QF_SMS_CODE_PEPPER:}
    sms-daily-limit: ${QF_SMS_DAILY_LIMIT:100}
    email-daily-limit: ${QF_EMAIL_DAILY_LIMIT:100}
    tencent:
      enabled: ${QF_TENCENT_SES_ENABLED:false}
      secret-id: ${QF_TENCENT_SECRET_ID:}
      secret-key: ${QF_TENCENT_SECRET_KEY:}
      from: ${QF_TENCENT_SES_FROM:}
      template-id: ${QF_TENCENT_SES_TEMPLATE_ID:}
      region: ${QF_TENCENT_SES_REGION:ap-hongkong}
    aliyun:
      enabled: ${QF_ALIYUN_SMS_ENABLED:false}
      access-key-id: ${QF_ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${QF_ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${QF_ALIYUN_SMS_SIGN_NAME:}
      template-code: ${QF_ALIYUN_SMS_TEMPLATE_CODE:}
    turnstile:
      site-key: ${QF_TURNSTILE_SITE_KEY:}
      secret-key: ${QF_TURNSTILE_SECRET_KEY:}
  rule-runner:
    base-url: ${QF_RULE_RUNNER_URL:http://rule-runner:8090}
    token: ${QF_RULE_RUNNER_TOKEN:quizforge-local-rule-token}
    max-concurrency: ${QF_RULE_RUNNER_CONCURRENCY:8}
    default-deadline: 8s

# Separate listener: loopback by default; Compose monitoring opts into its private network.
management:
  server:
    port: ${QF_MANAGEMENT_PORT:9091}
    address: ${QF_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        qf.rule.runner.duration: true
      minimum-expected-value:
        http.server.requests: 1ms
        qf.rule.runner.duration: 1ms
      maximum-expected-value:
        http.server.requests: 120s
        qf.rule.runner.duration: 120s
