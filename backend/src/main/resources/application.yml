spring:
  application:
    name: quizforge-backend
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 129MB
      file-size-threshold: 0
      resolve-lazily: true
  datasource:
    url: ${QF_DB_URL:jdbc:mysql://localhost:3306/quizforge?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${QF_DB_USER:quizforge}
    password: ${QF_DB_PASSWORD:quizforge}
    hikari:
      # Initial value; tune after load testing (ADR-002).
      maximum-pool-size: ${QF_DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  type-handlers-package: cloud.treenewbee.quizforge.shared.persistence
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

server:
  port: ${QF_PORT:8080}
  # The app sits behind Nginx; trust X-Forwarded-* only from it (deploy/nginx).
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO

qf:
  import:
    max-concurrency: ${QF_IMPORT_CONCURRENCY:2}
    requests-per-minute: ${QF_IMPORT_REQUESTS_PER_MINUTE:5}
  storage:
    blob-dir: ${QF_BLOB_DIR:./data/blobs}
  security:
    allowed-origin: ${QF_PUBLIC_ORIGIN:http://localhost:8088}
  rule-runner:
    base-url: ${QF_RULE_RUNNER_URL:http://rule-runner:8090}
    token: ${QF_RULE_RUNNER_TOKEN:quizforge-local-rule-token}
    max-concurrency: ${QF_RULE_RUNNER_CONCURRENCY:8}
    default-deadline: 8s
