global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: quizforge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:9091]
  - job_name: rule-runner
    metrics_path: /v1/metrics/prometheus
    follow_redirects: false
    http_headers:
      X-Internal-Token:
        files: [/etc/prometheus/runner-token]
    static_configs:
      - targets: [rule-runner:8090]
