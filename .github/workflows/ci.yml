name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rule-runner:
    name: Rule runner tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rule-runner/package-lock.json
      - name: Install dependencies
        working-directory: rule-runner
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Protocol, parity and isolation tests
        working-directory: rule-runner
        run: |
          ulimit -c 0
          npm test

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unit and integration tests; integration tests start MySQL 8.4 via Testcontainers.
      - name: Maven verify
        working-directory: backend
        run: mvn -B -ntp verify

  smoke:
    name: Compose smoke test (Nginx -> Java -> MySQL)
    runs-on: ubuntu-latest
    needs: [backend, rule-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Wait for health through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/health; then echo; exit 0; fi
            sleep 3
          done
          echo "health check did not pass"
          exit 1

      - name: Check rule-runner health with internal authentication
        run: >-
          docker compose -f deploy/docker-compose.yml exec -T rule-runner
          node --input-type=module -e
          "const r = await fetch('http://127.0.0.1:8090/v1/health',
          {headers:{'X-Internal-Token':process.env.QF_RULE_RUNNER_TOKEN}});
          if (!r.ok || !(await r.json()).ok) process.exit(1);"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
