name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: qf-ci-${{ github.run_id }}

jobs:
  frontend:
    name: Frontend fork build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build pinned richtext sources and verify online boundary
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test

  rule-runner:
    name: Rule runner tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rule-runner/package-lock.json
      - name: Install dependencies
        working-directory: rule-runner
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Protocol, parity and isolation tests
        working-directory: rule-runner
        run: |
          ulimit -c 0
          npm test

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test qbank upgrade tool (synthetic packages only)
        run: python3 -B -m unittest discover -s tools/qbank-upgrade -p 'test_*.py'

      - name: Check local fixture answer adapters (no network or load)
        run: python3 -B -m unittest discover -s loadtest/seed -p 'test_*.py'

      - name: Check local container counter exporter (mock Engine, no load)
        run: python3 -B -m unittest discover -s loadtest/profiling/exporter -p 'test_*.py'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unit and integration tests; integration tests start MySQL 8.4 via Testcontainers.
      - name: Maven verify
        working-directory: backend
        run: mvn -B -ntp verify

  smoke:
    name: Compose smoke test (Nginx -> Java -> MySQL)
    runs-on: ubuntu-latest
    needs: [backend, rule-runner, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Wait for health through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/health; then echo; exit 0; fi
            sleep 3
          done
          echo "health check did not pass"
          exit 1

      - name: Check rule-runner health with internal authentication
        run: >-
          docker compose -f deploy/docker-compose.yml exec -T rule-runner
          node --input-type=module -e
          "const r = await fetch('http://127.0.0.1:8090/v1/health',
          {headers:{'X-Internal-Token':process.env.QF_RULE_RUNNER_TOKEN}});
          if (!r.ok || !(await r.json()).ok) process.exit(1);"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Real browser login and progressive frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps --no-shell chromium
          QF_COMPOSE_PROJECT="$COMPOSE_PROJECT_NAME" QF_READ_BROWSER_TESTS=1 npx playwright test
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error

      - name: Verify shared blob writes and read-only runner access
        run: |
          mkdir -p "$RUNNER_TEMP/blob-probe"
          javac --release 21 -d "$RUNNER_TEMP/blob-probe" backend/src/test/deploy/BlobStoreProbe.java
          docker compose -f deploy/docker-compose.yml cp "$RUNNER_TEMP/blob-probe/BlobStoreProbe.class" app:/tmp/BlobStoreProbe.class
          output=$(docker compose -f deploy/docker-compose.yml exec -T app java -Xmx192m -Dloader.main=BlobStoreProbe -Dloader.path=/tmp -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher)
          blob_hash=$(printf '%s\n' "$output" | sed -n 's/^BLOB_SMOKE=//p')
          [[ "$blob_hash" =~ ^[a-f0-9]{64}$ ]]
          docker compose -f deploy/docker-compose.yml exec -T rule-runner node --input-type=module -e "
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {readBlob} from '/app/src/blobs.js';
          assert.notEqual(process.getuid(),0);
          const file=await readBlob(process.env.QF_BLOB_DIR,process.argv[1]);
          await assert.rejects(writeFile(file,'forbidden'),e=>e.code==='EROFS');
          console.log('Shared blob verified; runner mount is read-only');" "$blob_hash"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
